version: 1
title: 'Taos Geschichtengarten: Die Kerbe im Boot'
slug: translation-50-de-3e70b2
summary: Das Bühnenschwert fällt neben einer Weide ins Wasser. Ahe merkt sich nicht
  das Ufer, sondern macht eine Kerbe ins Boot. Am Steg ist die Kerbe noch da. Wo bleibt
  das Schwert? Sechs Szenen über bewegliche und feste Anhaltspunkte.
